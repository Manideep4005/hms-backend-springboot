<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Password Reset OTP</title>
</head>

<body style="font-family: Arial, sans-serif; background:#f4f6f8; padding:20px;">

    <div
        style="max-width:600px; margin:auto; background:#ffffff; border-radius:10px; overflow:hidden; border:1px solid #ddd;">

        <div style="background:#0d6efd; color:white; padding:20px; text-align:center;">
            <h2>HMS Password Reset</h2>
        </div>

        <div style="padding:30px; color:#333;">
            <p>Dear <strong th:text="${firstName}">User</strong>,</p>

            <p>We received a request to reset your password.</p>

            <p>Your One-Time Password (OTP) is:</p>

            <div style="text-align:center; margin:25px 0;">
                <span th:text="${otp}" style="font-size:32px; letter-spacing:8px; font-weight:bold; color:#0d6efd;">
                    123456
                </span>
            </div>

            <p>This OTP is valid for <strong>5 minutes</strong>.</p>

            <p>If you did not request a password reset, please ignore this email.</p>

            <p>Regards,<br><strong>HMS Team</strong></p>
        </div>

    </div>

</body>

</html>
