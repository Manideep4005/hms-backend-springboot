<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Password Changed</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: auto; padding: 20px; border: 1px solid #ddd; border-top: 5px solid #28a745; border-radius: 8px;">
        <h2 style="color: #28a745;">Password Successfully Changed</h2>
        <p>Dear <span th:text="${firstName}">User</span>,</p>
        <p>Your password for your Hospital Management System account was recently changed.</p>
        <p>If you did not perform this action, please contact support immediately.</p>
        <p>Best Regards,<br>The HMS Team</p>
    </div>
</body>
</html>
