<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Changed</title>
</head>

<body style="margin:0;padding:0;background:#f4f5f7;font-family:Arial, Helvetica, sans-serif;color:#374151;">

    <table width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
            <td align="center" style="padding:32px 16px;">

                <table width="480" cellpadding="0" cellspacing="0" border="0"
                    style="max-width:480px;width:100%;background:#ffffff;border-radius:14px;border:1px solid #ececec;">

                    <!-- Brand -->
                    <tr>
                        <td align="center" style="padding:32px 30px 8px;">
                            <a href="https://hms-react-frontend.vercel.app" style="text-decoration:none;">
                                <img src="https://hms-react-frontend.vercel.app/MANI_HOSPITAL.png" alt="HMS" width="120"
                                    style="display:block;border:0;margin:0 auto;">
                            </a>
                        </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td style="padding:20px 34px 36px;text-align:center;">

                            <h1 style="margin:0 0 14px;font-size:21px;font-weight:600;color:#1f2937;">
                                Password changed
                            </h1>

                            <p style="margin:0 0 20px;font-size:14px;line-height:1.65;color:#5b6472;">
                                Hi <strong style="color:#1f2937;" th:text="${firstName}">User</strong>,
                                your HMS account password was successfully changed.
                            </p>

                            <!-- Change Details -->
                            <table width="100%" cellpadding="0" cellspacing="0" border="0"
                                style="background:#f9fafb;border-radius:10px;margin-bottom:22px;">
                                <tr>
                                    <td style="padding:12px 16px;font-size:12.5px;color:#8b94a3;">Changed on</td>
                                    <td align="right"
                                        style="padding:12px 16px;font-size:12.5px;color:#1f2937;font-weight:600;">
                                        <span th:text="${changedAt}">20 Aug 2026, 12:03 PM IST</span>
                                    </td>
                                </tr>
                            </table>

                            <p
                                style="margin:0;padding-top:20px;border-top:1px solid #f0f0f0;font-size:12.5px;line-height:1.6;color:#8b94a3;">
                                If this wasn't you, please contact your HMS administrator immediately.
                            </p>

                            <p style="margin:22px 0 0;font-size:13px;line-height:1.6;color:#5b6472;">
                                Thanks,<br><strong style="color:#1f2937;">HMS Team</strong>
                            </p>

                        </td>
                    </tr>

                </table>

                <p style="margin:20px 0 0;font-size:11px;color:#a3aab5;">Hospital Management System</p>

            </td>
        </tr>
    </table>

</body>

</html>
