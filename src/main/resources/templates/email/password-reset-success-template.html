<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Password Reset Successful</title>
</head>

<body style="font-family: Arial, sans-serif; background:#f4f6f8; padding:20px;">

    <div
        style="max-width:600px; margin:auto; background:#ffffff; border-radius:10px; overflow:hidden; border:1px solid #ddd;">

        <div style="background:#198754; color:white; padding:20px; text-align:center;">
            <h2>Password Reset Successful</h2>
        </div>

        <div style="padding:30px; color:#333;">
            <p>Dear <strong th:text="${firstName}">User</strong>,</p>

            <p>Your HMS account password has been successfully changed.</p>

            <p>If you did not perform this action, please contact support immediately.</p>

            <p>Regards,<br><strong>HMS Team</strong></p>
        </div>

    </div>

</body>

</html>
